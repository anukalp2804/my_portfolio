<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Anukalp Pandey</title>
  <!-- Self-contained on purpose: this file is served from any URL depth, so it must not depend on relative CSS/JS paths. -->
  <style>
    :root { --bg:#0c0b14; --text:#f6f4ff; --muted:#aaa7c1; --gold:#fbbf24; --ink:#1a1405; --glow:rgba(251,191,36,.14); }
    @media (prefers-color-scheme: light) {
      :root { --bg:#fffbf2; --text:#1f1b2e; --muted:#5d5873; --gold:#f59e0b; --ink:#1f1b2e; --glow:rgba(245,158,11,.22); }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center;
      background: radial-gradient(40rem 28rem at 50% 20%, var(--glow), transparent 65%), var(--bg);
      color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      font-size: clamp(5rem, 22vw, 9rem); line-height: 1; font-weight: 800;
      background: linear-gradient(90deg, var(--gold), #fb923c); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { color: var(--muted); margin: 12px 0 28px; font-size: 1.1rem; }
    a {
      display: inline-block; padding: 14px 28px; border-radius: 999px; background: var(--gold);
      color: var(--ink); font-weight: 700; text-decoration: none;
    }
    a:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page doesn't exist or has moved.</p>
    <a href="/">Back to portfolio</a>
  </main>
</body>
</html>
