<body data-org="owasp">

  <a href="#results-panel" class="skip-link">Skip to results</a>
  <div class="scroll-progress" aria-hidden="true"></div>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <nav class="navbar org-nav" aria-label="Main navigation">
    <div class="container nav-container">
      <a href="../../index.html" class="logo" aria-label="Anukalp - home">ANUKALP<span class="dot">.</span></a>

      <div class="nav-right">
        <a href="../../index.html" class="org-back" aria-label="Back to portfolio">
          <i class="fas fa-arrow-left" aria-hidden="true"></i><span>Back to portfolio</span>
        </a>
        <a href="https://github.com/anukalp2804" target="_blank" rel="noopener noreferrer" class="org-icon-btn" aria-label="GitHub profile" title="GitHub profile">
          <i class="fab fa-github" aria-hidden="true"></i>
        </a>
        <button id="theme-toggle" type="button" aria-label="Toggle light/dark theme">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <header class="org-hero">
    <div class="org-watermark" aria-hidden="true">OWASP</div>
    <div class="container">
      <span class="badge org-badge"><span class="org-dot" aria-hidden="true"></span> Open-source contributions</span>
      <h1 class="org-title">OWASP <span class="gradient-text">Contributions</span></h1>
      <p class="org-sub">Pull requests and issues I have worked on for the OWASP Foundation.</p>

      <div class="org-stats" aria-label="Summary">
        <div class="org-stat"><span class="stat-num" data-stat="merged">&ndash;</span><span class="stat-label">Merged PRs</span></div>
        <div class="org-stat"><span class="stat-num" data-stat="pending">&ndash;</span><span class="stat-label">Pending PRs</span></div>
        <div class="org-stat"><span class="stat-num" data-stat="issues">&ndash;</span><span class="stat-label">Issues</span></div>
      </div>
    </div>
  </header>

  <main class="org-main container">
    <div class="org-tabs" role="tablist" aria-label="Contribution type">
      <button class="org-tab" role="tab" id="tab-merged" data-key="merged" data-file="../Data/owasp/merged.txt" aria-selected="true" aria-controls="results-panel">
        <i class="fas fa-code-merge" aria-hidden="true"></i><span>Merged PRs</span><b class="count">&ndash;</b>
      </button>
      <button class="org-tab" role="tab" id="tab-pending" data-key="pending" data-file="../Data/owasp/pending.txt" aria-selected="false" aria-controls="results-panel" tabindex="-1">
        <i class="fas fa-code-pull-request" aria-hidden="true"></i><span>Pending PRs</span><b class="count">&ndash;</b>
      </button>
      <button class="org-tab" role="tab" id="tab-issues" data-key="issues" data-file="../Data/owasp/issue.txt" aria-selected="false" aria-controls="results-panel" tabindex="-1">
        <i class="fas fa-circle-dot" aria-hidden="true"></i><span>Issues</span><b class="count">&ndash;</b>
      </button>
    </div>

    <div class="org-toolbar">
      <label class="org-search">
        <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
        <span class="sr-only">Search contributions</span>
        <input type="search" id="org-search" placeholder="Search by project, number or text..." autocomplete="off" />
      </label>
      <p class="org-result" id="org-result" role="status" aria-live="polite"></p>
    </div>

    <div id="results-panel" class="org-list" role="tabpanel" tabindex="-1" aria-labelledby="tab-merged"></div>
    <noscript><p class="org-noscript">This page needs JavaScript to load the contribution lists.</p></noscript>
  </main>

  <footer class="main-footer">
    <div class="container footer-container">
      <div class="footer-text">
        <p>Designed &amp; Built by <span class="footer-name">Anukalp Pandey</span></p>
      </div>
      <p class="copyright">&copy; <span id="year">2026</span> Anukalp Pandey &middot; OWASP Foundation</p>
    </div>
  </footer>

  <a href="#top" class="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up" aria-hidden="true"></i></a>

  <script src="../org.js"></script>
  <script src="../../analytics.js" defer></script>
